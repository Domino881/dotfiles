debug {
    disable_logs = true
}

# Main modifier
$mainMod = SUPER # windows key

# assign apps
$BROWSER           = firefox
$EDITOR            = nvim
$EXPLORER          = thunar
$TERM_EXPLORER     = ghostty -e yazi
$TERMINAL          = ghostty
$LOCKSCREEN        = hyprlock
$MENU              = rofi -show drun
$MENU2             = hyprlauncher
$SCREENSHOT_REGION = grim -g "$(slurp)" - | swappy -f -
$SCREENSHOT        = grim - | swappy -f -

# // █░░ ▄▀█ █░█ █▄░█ █▀▀ █░█
# // █▄▄ █▀█ █▄█ █░▀█ █▄▄ █▀█

# See https://wiki.hyprland.org/Configuring/Keywords/

$DBUS_SHARE_PICKER    = dbus-update-activation-environment --systemd --all # for XDPH
$SYSTEMD_SHARE_PICKER = systemctl --user import-environment QT_QPA_PLATFORMTHEME WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
$WIDGETS              = ~/.config/ags/start.sh
# $APPTRAY_BLUETOOTH    = blueman-applet
$APPTRAY_BATTERY      = matebook-applet
$NETWORK_MANAGER      = nm-applet --no-agent
# $REMOVABLE_MEDIA      = udiskie --no-automount --smart-tray --no-notify --no-appindicator
$AUTH_DIALOGUE        = systemctl --user start hyprpolkitagent
$IDLE_DAEMON          = hypridle
$BATTERY_NOTIFY       = batsignal -b -e -M "kdialog --sorry '%s (%s%)'"
$WALLPAPER            = $HOME/.local/bin/set_wallpaper.sh ~/Pictures/wallpapers/NGC7000.jpg
$BLUE_LIGHT_FILTER    = hyprsunset

# // █▀▀ █▄░█ █░█
# // ██▄ █░▀█ ▀▄▀

# See https://wiki.hyprland.org/Configuring/Environment-variables/

# Toolkit Backend Variables - https://wiki.hyprland.org/Configuring/Environment-variables/#toolkit-backend-variables
$env.GDK_BACKEND     = wayland,x11,* # GTK: Use wayland if available. If not: try x11, then any other GDK backend.
$env.SDL_VIDEODRIVER = wayland # Run SDL2 applications on Wayland. Remove or set to x11 if games that provide older versions of SDL cause compatibility issues
$env.CLUTTER_BACKEND = wayland # Clutter package already has wayland enabled, this variable will force Clutter applications to try and use the Wayland backend
$env.GTK_THEME       = Adwaita:dark
$env.GTK2_RC_FILES   = /usr/share/themes/Adwaita-dark/gtk-2.0/gtkrc

# XDG Specifications - https://wiki.hyprland.org/Configuring/Environment-variables/#xdg-specifications
$env.XDG_CURRENT_DESKTOP = Hyprland
$env.XDG_SESSION_TYPE    = wayland
$env.XDG_SESSION_DESKTOP = Hyprland

# Qt Variables  - https://wiki.hyprland.org/Configuring/Environment-variables/#qt-variables
$env.QT_AUTO_SCREEN_SCALE_FACTOR         = 1.5 # (From the Qt documentation) enables automatic scaling, based on the monitor’s pixel density
$env.QT_QPA_PLATFORM                     = wayland;xcb # Tell Qt applications to use the Wayland backend, and fall back to x11 if Wayland is unavailable
$env.QT_WAYLAND_DISABLE_WINDOWDECORATION = 1 # Disables window decorations on Qt applications
$env.QT_QPA_PLATFORMTHEME                = qt6ct # Tells Qt based applications to pick your theme from qt5ct, use with Kvantum.
$env.QT_STYLE_OVERRIDE                   = 

$env.MOZ_ENABLE_WAYLAND           = 1 # Enable Wayland for Firefox
$env.GDK_SCALE                    = 1.5 # Set GDK scale to 1 // For Xwayland on HiDPI
$env.ELECTRON_OZONE_PLATFORM_HINT = auto # Set Electron Ozone Platform Hint to auto // For Electron apps on Wayland

#  XDG-DIRS
$env.XDG_RUNTIME_DIR = $XDG_RUNTIME_DIR
$env.XDG_CONFIG_HOME = $HOME/.config
$env.XDG_CACHE_HOME  = $HOME/.cache
$env.XDG_DATA_HOME   = $HOME/.local/share
$env.XDG_STATE_HOME  = $HOME/.local/state

# // █▀▀ ▀█▀ █▄▀
# // █▄█ ░█░ █░█

$COLOR_SCHEME = prefer-dark

# // █▀▀ █░█ █▀█ █▀ █▀█ █▀█
# // █▄▄ █▄█ █▀▄ ▄█ █▄█ █▀▄

$CURSOR_THEME = Bibata-Modern-Ice
$CURSOR_SIZE  = 24

# // █▀▀ █▀█ █▄░█ ▀█▀
# // █▀░ █▄█ █░▀█ ░█░

$FONT                = Noto Sans
$FONT_SIZE           = 12
$DOCUMENT_FONT       = Noto Sans
$DOCUMENT_FONT_SIZE  = 12
$MONOSPACE_FONT      = JetBrainsMono Nerd Font
$MONOSPACE_FONT_SIZE = 12
$FONT_ANTIALIASING   = rgba
$FONT_HINTING        = full

# // █▀▄▀█ █▀█ █▄░█ █ ▀█▀ █▀█ █▀█
# // █░▀░█ █▄█ █░▀█ █ ░█░ █▄█ █▀▄

# See https://wiki.hyprland.org/Configuring/Monitors/

monitor=eDP-1, 2160x1440@60, 0x0,  1.5
monitor=     , preferred,    auto, auto

# Uncomment below for mirroring to projector/tv
# monitor=eDP-1, 1920x1080@60, 0x0,  1
# monitor=     , preferred,    auto, 1,  mirror, eDP-1

# // █▀ █▀█ █▀▀ █▀▀ █ ▄▀█ █░░
# // ▄█ █▀▀ ██▄ █▄▄ █ █▀█ █▄▄

# pywal colors
source=$env.XDG_CACHE_HOME/wal/colors-hyprland.conf

general {
    gaps_in = 3
    gaps_out = 5
    border_size = 1
    col.active_border = $color6
    col.inactive_border = rgba(44444400)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    dim_special = 0.3
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1
    rounding = 10
    rounding_power = 2

    shadow {
        enabled = false
    }
    blur {
        size = 6
        passes = 2
        enabled = false
    }
}

# // ▄▀█ █▄░█ █ █▀▄▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█
# // █▀█ █░▀█ █ █░▀░█ █▀█ ░█░ █ █▄█ █░▀█

# See https://wiki.hyprland.org/Configuring/Animations/

animations {
    enabled = yes
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 2, wind, slide
    animation = windowsIn, 1, 2, winIn, slide
    animation = windowsOut, 1, 2, winOut, slide
    animation = layersIn, 1, 2, winIn, slide
    animation = layersOut, 1, 1, winOut, none
    animation = windowsMove, 1, 2, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 0
    animation = fade, 1, 10, default
    animation = workspaces, 1, 2, default
}


# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


input {
    # See https://wiki.hyprland.org/Configuring/Variables/#input
    accel_profile = flat
    numlock_by_default = true

    # 0 - Cursor movement will not change focus.
    # 1 - Cursor movement will always change focus to the window under the cursor.
    # 2 - Cursor focus will be detached from keyboard focus. Clicking on a window will move keyboard focus to that window.
    # 3 - Cursor focus will be completely separate from keyboard focus. Clicking on a window will not change keyboard focus.
    follow_mouse = 2

    sensitivity = 0.25 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = true
        tap-and-drag = true
        drag_lock = 1
    }
    kb_layout = pl
    kb_variant = ,qwerty
}

gestures {
    #See https://wiki.hyprland.org/Configuring/Variables/#gestures
    # workspace_swipe = true
    gesture = 3, horizontal, workspace
    workspace_swipe_distance = 300
    workspace_swipe_min_speed_to_force = 10
}


# █▄▀ █▀▀ █▄█ █▄▄ █ █▄░█ █▀▄ █ █▄░█ █▀▀ █▀
# █░█ ██▄ ░█░ █▄█ █ █░▀█ █▄▀ █ █░▀█ █▄█ ▄█

bind = $mainMod, RETURN, exec, $TERMINAL
bind = $mainMod, Q, killactive,
bind = $mainMod + SHIFT, Q, exec, hyprctl kill
bind = $mainMod + SHIFT, E, exit,
bind = $mainMod, E, exec, $EXPLORER
bind = $mainMod, R, exec, cyclic_hyprland_resize
bind = $mainMod + SHIFT, SPACE, togglefloating,
bind = $mainMod, F, exec, hyprctl dispatch fullscreen 1
bind = $mainMod + SHIFT, F, fullscreen
bind = $mainMod, D, exec, $MENU
bind = $mainMod + SHIFT, D, exec, $MENU2
bind = $mainMod + CTRL, L, exec, $LOCKSCREEN
bindl= ,switch:Lid Switch, exec, $LOCKSCREEN

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod + SHIFT, H, movewindow, l
bind = $mainMod + SHIFT, L, movewindow, r
bind = $mainMod + SHIFT, K, movewindow, u
bind = $mainMod + SHIFT, J, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad/minimize
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod, S, movetoworkspace, +0
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod, S, movetoworkspace, special:magic
bind = $mainMod, S, togglespecialworkspace, magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

binde = $mainMod, equal, resizeactive, 30 0
binde = $mainMod, minus, resizeactive, -30 0
binde = $mainMod + SHIFT, equal, resizeactive, 0 30
binde = $mainMod + SHIFT, minus, resizeactive, 0 -30

# Laptop multimedia keys for volume
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness keys
$BRIGHTNESS_EXPONENT = 3
bindel = ,XF86MonBrightnessUp, exec, brightness_external.sh --exponent=$BRIGHTNESS_EXPONENT set +5%
bindel = ,XF86MonBrightnessDown, exec, brightness_external.sh --exponent=$BRIGHTNESS_EXPONENT set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshots
bind = SHIFT, Print, exec, $SCREENSHOT_REGION
bind = , Print, exec, $SCREENSHOT

# Vertical / horizontal split toggle
bind = $mainMod, Y, togglesplit

# // █░░ ▄▀█ █▄█ █▀█ █░█ ▀█▀ █▀
# // █▄▄ █▀█ ░█░ █▄█ █▄█ ░█░ ▄█

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/

dwindle {
    pseudotile = yes
    preserve_split = yes
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/

master {
    new_status = master
}


# // █▀▄▀█ █ █▀ █▀▀
# // █░▀░█ █ ▄█ █▄▄

# See https://wiki.hyprland.org/Configuring/Variables/#misc

misc {
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    anr_missed_pings = 10
    font_family = $FONT
}

xwayland {
    force_zero_scaling = true
}

general {
    snap { # snapping for floating windows
        enabled = true
    }
}

# // █▀▀ █▄░█ █░█
# // ██▄ █░▀█ ▀▄▀

# # See https://wiki.hyprland.org/Configuring/Environment-variables/

# Qt Variables
env = QT_AUTO_SCREEN_SCALE_FACTOR,$env.QT_AUTO_SCREEN_SCALE_FACTOR
env = QT_QPA_PLATFORM,$env.QT_QPA_PLATFORM
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,$env.QT_WAYLAND_DISABLE_WINDOWDECORATION
env = QT_QPA_PLATFORMTHEME,$env.QT_QPA_PLATFORMTHEME
env = GTK_THEME,$env.GTK_THEME
env = GTK2_RC_FILES,$env.GTK2_RC_FILES
# env = QT_STYLE_OVERRIDE,$env.QT_STYLE_OVERRIDE

# Wayland-ENV
env = MOZ_ENABLE_WAYLAND,$env.MOZ_ENABLE_WAYLAND
env = GDK_SCALE,$env.GDK_SCALE
env = ELECTRON_OZONE_PLATFORM_HINT,$env.ELECTRON_OZONE_PLATFORM_HINT

# XDG Spec
env = XDG_CURRENT_DESKTOP,$env.XDG_CURRENT_DESKTOP
env = XDG_SESSION_TYPE,$env.XDG_SESSION_TYPE
env = XDG_SESSION_DESKTOP,$env.XDG_SESSION_DESKTOP

# XDG-ENV
env = XDG_CONFIG_HOME,$env.XDG_CONFIG_HOME
env = XDG_CACHE_HOME,$env.XDG_CACHE_HOME
env = XDG_DATA_HOME,$env.XDG_DATA_HOME


# // █░░ ▄▀█ █░█ █▄░█ █▀▀ █░█
# // █▄▄ █▀█ █▄█ █░▀█ █▄▄ █▀█

exec-once = $DBUS_SHARE_PICKER # for XDPHgl
exec-once = $SYSTEMD_SHARE_PICKER # for XDPH
exec-once = $AUTH_DIALOGUE # authentication dialogue for GUI apps
exec-once = $APPTRAY_BLUETOOTH # systray app for Bluetooth
exec-once = $APPTRAY_BATTERY # battery protection applet
exec-once = $REMOVABLE_MEDIA # front-end that allows to manage removable media
exec-once = $NETWORK_MANAGER # systray app for Network/Wifi
exec-once = $WALLPAPER # start wallpaper daemon
exec-once = $BATTERY_NOTIFY # battery notification
exec-once = $IDLE_DAEMON # idle daemon
exec-once = $BLUE_LIGHT_FILTER # blue light filter
exec-once = $WIDGETS # AGS bar, osd and notifications

# // █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# // ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

# See https://wiki.hyprland.org/Configuring/Window-Rules/

# Workspaces
workspace = 1, monitor:desc:Dell Inc. DELL S2719H 17S8FM2
workspace = 2, monitor:desc:Dell Inc. DELL S2719H 17S8FM2
workspace = 3, monitor:desc:Dell Inc. DELL S2719H 17S8FM2
workspace = 4, monitor:desc:BOE 0x0893
workspace = 5, monitor:desc:BOE 0x0893
workspace = 6, monitor:desc:BOE 0x0893
exec-once = hyprctl dispatch workspace 1

# Ony add the Core applications here
windowrulev2 = float, class:^(com.gabm.satty)$
windowrulev2 = float,title:^(About Mozilla Firefox)$
windowrulev2 = float,class:^(firefox)$,title:^(Picture-in-Picture)$
windowrulev2 = float,class:^(firefox)$,title:^(Library)$
windowrulev2 = float,class:^(.*)$,initialTitle:^(.*)(top)(.*)$
windowrulev2 = float,class:^(.*)$,initialTitle:^(.*)(btop)(.*)$
windowrulev2 = float,class:^(.*)$,initialTitle:^(.*)(htop)(.*)$
windowrulev2 = float,class:^(vlc)$
windowrulev2 = float,class:^(kvantummanager)$
windowrulev2 = float,class:^(qt5ct)$
windowrulev2 = float,class:^(qt6ct)$
windowrulev2 = float,class:^(nwg-look)$
windowrulev2 = float,class:^(nwg-displays)$
windowrulev2 = float,class:^(org.kde.ark)$
windowrulev2 = float,class:^(blueman-manager)$
windowrulev2 = float,class:^(nm-applet)$
windowrulev2 = float,class:^(nm-connection-editor)$
windowrulev2 = float,class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float,class:^([Xx]dg-desktop-portal-gtk)$
windowrulev2 = float,initialTitle:^(File Operation Progress)$
windowrulev2 = float,initialTitle:^(Rename .*)$

windowrulev2 = tag +ags-popup,class:^(.*)blueberry.py$
windowrulev2 = tag +ags-popup,class:^(.*)Overskride
windowrulev2 = tag +ags-popup,class:^(org.pulseaudio.pavucontrol)$

# AGS popup rules
windowrulev2 = float,tag:ags-popup
windowrulev2 = pin,tag:ags-popup
windowrule = size 39% 39%,tag:ags-popup
windowrule = move 60% 5%,tag:ags-popup

# Wolfram Splash
windowrulev2 = float,class:^(com.wolfram.Wolfram.14.3)$,initialTitle:WolframNB
windowrulev2 = noblur,class:^(com.wolfram.Wolfram.14.3)$,initialTitle:WolframNB
windowrulev2 = center,class:^(com.wolfram.Wolfram.14.3)$,initialTitle:WolframNB
windowrulev2 = noborder,class:^(com.wolfram.Wolfram.14.3)$,initialTitle:WolframNB
windowrulev2 = nofocus,class:^(com.wolfram.Wolfram.14.3)$,initialTitle:WolframNB
windowrulev2 = maxsize 400 400,class:^(com.wolfram.Wolfram.14.3)$,initialTitle:WolframNB

windowrulev2 = float,class:^thunar$,title:^Rename.*$
windowrule   = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# No idle when fullscreen app open
windowrulev2 = idleinhibit fullscreen, class:^(.*)$
windowrulev2 = idleinhibit fullscreen, title:^(.*)$
windowrulev2 = idleinhibit fullscreen, fullscreen:1


# // █░░ ▄▀█ █▄█ █▀▀ █▀█   █▀█ █░█ █░░ █▀▀ █▀
# // █▄▄ █▀█ ░█░ ██▄ █▀▄   █▀▄ █▄█ █▄▄ ██▄ ▄█

layerrule = blur,rofi
layerrule = ignorezero,rofi
# layerrule = blur,notifications
layerrule = ignorezero,notifications
# layerrule = blur,swaync-notification-window
# layerrule = ignorezero,swaync-notification-window
# layerrule = blur,swaync-control-center
# layerrule = ignorezero,swaync-control-center
# layerrule = blur,logout_dialog
layerrule = noanim,noanim
layerrule = ignorezero,noblur
# layerrule = blur,top-bar
layerrule = ignorezero,top-bar
layerrule = xray,top-bar
